name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only lint/test/build. No deployment step in this workflow — deploying
# remains a manual, explicit decision until docs/architecture-decision-hosting.md
# is executed and monitoring/rollback are in place.
# See docs/production-readiness-audit.md, section 11.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (locked, reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
