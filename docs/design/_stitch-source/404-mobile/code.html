<script>
        // Micro-interaction for hover effects on the 404 text
        const h1 = document.querySelector('h1');
        document.addEventListener('mousemove', (e) => {

            const y = (window.innerHeight / 2 - e.pageY) / 25;
            h1.style.transform = `translate(${x}px, ${y}px)`;
